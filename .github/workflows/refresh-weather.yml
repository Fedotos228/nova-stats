name: Refresh weather images (fallback)

# The refresh itself now runs as a Vercel Cron (see vercel.json, 11:00 UTC). This workflow
# is a backup that calls the very same endpoint a few hours later, so a cron that silently
# fails to fire still gets covered the same day. Both are idempotent — last write wins.
#
# It deliberately does not reimplement the refresh: if Vercel were down hard, an
# independent copy would not help anyway, because the display itself is served from Vercel.
on:
  schedule:
    # 18:00 UTC ≈ 21:00 Europe/Chisinau in summer (UTC+3).
    - cron: "0 18 * * *"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the refresh endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -sS -o /tmp/body.json -w '%{http_code}' \
            --max-time 300 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://nova-stats.vercel.app/api/cron/refresh-weather)
          cat /tmp/body.json
          echo
          test "$code" = "200"
